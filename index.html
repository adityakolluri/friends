<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends Forever</title>
<link rel="stylesheet" href="friendship-style.css">
</head>
<body>

<div class="aura"></div>
<div class="stars"></div>

<header class="hero">
  <div class="stage">
    <div class="parallax">
      <div class="ring-tilt">
        <div class="ring" id="ring">

          <div class="panel" data-full="images/full/photo-01.jpg" data-name="SAMAPTH" tabindex="0" role="button" aria-label="Open photo of Samapth">
            <img src="images/image-01.jpg" alt="SAMAPTH" loading="lazy" draggable="false">
            <div class="panel-scrim"></div>
            <div class="panel-cap">SAMAPTH</div>
          </div>

          <div class="panel" data-full="images/full/photo-02.jpg" data-name="PRAVEEEN" tabindex="0" role="button" aria-label="Open photo of Praveeen">
            <img src="images/image-02.jpg" alt="PRAVEEEN" loading="lazy" draggable="false">
            <div class="panel-scrim"></div>
            <div class="panel-cap">PRAVEEEN</div>
          </div>

          <div class="panel" data-full="images/full/photo-03.jpg" data-name="OSHO" tabindex="0" role="button" aria-label="Open photo of Osho">
            <img src="images/image-03.jpg" alt="OSHO" loading="lazy" draggable="false">
            <div class="panel-scrim"></div>
            <div class="panel-cap">OSHO</div>
          </div>

          <div class="panel" data-full="images/full/photo-04.jpg" data-name="AJAY" tabindex="0" role="button" aria-label="Open photo of Ajay">
            <img src="images/image-04.jpg" alt="AJAY" loading="lazy" draggable="false">
            <div class="panel-scrim"></div>
            <div class="panel-cap">AJAY</div>
          </div>

          <div class="panel" data-full="images/full/photo-05.jpg" data-name="MARK" tabindex="0" role="button" aria-label="Open photo of Mark">
            <img src="images/image-05.jpg" alt="MARK" loading="lazy" draggable="false">
            <div class="panel-scrim"></div>
            <div class="panel-cap">MARK</div>
          </div>

          <div class="panel" data-full="images/full/photo-06.jpg" data-name="RAMA KRISHNA" tabindex="0" role="button" aria-label="Open photo of Rama Krishna">
            <img src="images/image-06.jpg" alt="RAMA KRISHNA" loading="lazy" draggable="false">
            <div class="panel-scrim"></div>
            <div class="panel-cap">RAMA KRISHNA</div>
          </div>

          <div class="panel" data-full="images/full/photo-07.jpg" data-name="BHANU PRAKASH" tabindex="0" role="button" aria-label="Open photo of Bhanu Prakash">
            <img src="images/image-07.jpg" alt="BHANU PRAKASH" loading="lazy" draggable="false">
            <div class="panel-scrim"></div>
            <div class="panel-cap">BHANU PRAKASH</div>
          </div>

          <div class="panel" data-full="images/full/photo-08.jpg" data-name="BHARATH" tabindex="0" role="button" aria-label="Open photo of Bharath">
            <img src="images/image-08.jpg" alt="BHARATH" loading="lazy" draggable="false">
            <div class="panel-scrim"></div>
            <div class="panel-cap">BHARATH</div>
          </div>

          <div class="panel" data-full="images/full/photo-09.jpg" data-name="MOHAN" tabindex="0" role="button" aria-label="Open photo of Mohan">
            <img src="images/image-09.jpg" alt="MOHAN" loading="lazy" draggable="false">
            <div class="panel-scrim"></div>
            <div class="panel-cap">MOHAN</div>
          </div>

          <div class="panel" data-full="images/full/photo-10.jpg" data-name="VENKEY" tabindex="0" role="button" aria-label="Open photo of Venkey">
            <img src="images/image-10.jpg" alt="VENKEY" loading="lazy" draggable="false">
            <div class="panel-scrim"></div>
            <div class="panel-cap">VENKEY</div>
          </div>

        </div>
      </div>
      <div class="hero-text">
        <div class="eyebrow">&#10084; BEST FRIENDS &#10084;</div>
        <h1>BEST PEOPLE I EVER MET!</h1>
        <p>Every picture is a memory, every smile a story. Tap a photo to see it bigger.</p>
      </div>
    </div>
  </div>
</header>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <figure>
    <img id="lbImg" src="" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
</div>

<!-- Background Music -->
<audio id="bgMusic" src="audio/bg-music.mp3" loop preload="auto"></audio>

<script src="friendship-script.js"></script>
</body>
</html>

<script src="friendship-script.js"></script>
</body>
</html>
